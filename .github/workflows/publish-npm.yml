name: Publish to NPM

# Publishes the package to the NPM registry using npm trusted publishing (OIDC): the job trades its
# short-lived GitHub OIDC token for a publish grant, so no NPM token exists anywhere -- not in the repo
# secrets, not on the maintainer's machine. Provenance is generated automatically for a public package
# published this way, so nothing has to ask for it.
#
# The trusted publisher configured on npmjs.com (Package settings -> Trusted publisher) names THIS file
# by its bare filename, `publish-npm.yml`, and the match is case-sensitive: renaming or moving the file
# silently breaks publishing until the setting is updated to match.
#
# Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0, both satisfied by the Node version in
# `.nvmrc`.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required: this is what lets the job mint the OIDC token npm authenticates with.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # `npm ci` and `npm publish` both run the `prepare` script, which installs husky -- pointless in CI.
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          # Matches the setup npm documents for trusted publishing; the package-manager cache is left off
          # there, and a publish job runs rarely enough that the cache would buy little.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # `dist/` is gitignored, so everything the published tarball ships exists only after a build.
      - name: Build
        run: npm run build

      # Picks the `beta` dist-tag for a pre-release version and `latest` otherwise.
      - name: Publish
        run: npm run publish:npm
